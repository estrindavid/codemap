[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "codemap"
version = "0.1.0"
description = "An interactive, local map of a Python codebase, laid out in the order to read it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []   # the standard library only

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
codemap = "codemap.serve:main"

[tool.setuptools.packages.find]
include = ["codemap*"]

[tool.setuptools.package-data]
codemap = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["sample"]
